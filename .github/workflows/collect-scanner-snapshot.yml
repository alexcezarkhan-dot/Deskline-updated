name: Collect Scanner Snapshots

# Frankfurter (7 forex pairs) and gold-api.com (gold spot) are both free
# and keyless, so a run costs nothing. FCS remains only a backup source
# for gold if the keyless feed is ever unreachable.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  collect-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the real snapshot collection
        run: curl -sf "https://deskterminal.com/.netlify/functions/collect-scanner-snapshot" > /dev/null
